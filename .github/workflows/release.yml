name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with universal target on macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Developer ID signing + notarization. APPLE_SIGNING_IDENTITY is deliberately
          # absent: tauri-bundler derives the identity from the certificate itself, and
          # setting it by hand only adds a way to mismatch. The ad-hoc signing step that
          # used to sit above set it to "-", which hard-errors against a real certificate.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Ecliptr ${{ github.ref_name }}'
          releaseBody: 'Download the installer for your platform below. See https://ecliptr.app/download to get set up.'
          # Built as a draft so a half-finished release can never reach the updater.
          # Both matrix legs upload into the same draft; the `publish` job below flips
          # it public only once BOTH have succeeded. See that job for why.
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brokr-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe

  # A release goes public only when every platform built.
  #
  # `fail-fast: false` above is deliberate — one platform failing should not cancel the
  # other, so we still get the artifacts and the logs. But combined with an immediately
  # public release it used to mean a failed leg still shipped: v0.14.6, v0.14.7 and
  # v0.14.8 each published with Windows assets only and a latest.json carrying no darwin
  # keys, and every Mac silently stopped receiving updates for three releases. v0.15.130
  # did the mirror image (macOS only) during the 2026-08-06 Actions outage.
  #
  # `needs: build` fails if ANY matrix leg failed, so this job is skipped and the release
  # stays a draft. Drafts are invisible to /releases/latest/download/latest.json, so
  # installed apps keep seeing the last good version instead of a broken partial one.
  #
  # A tag containing a hyphen (v0.15.133-rc1, v0.16.0-signing-test) never auto-publishes.
  # It builds, uploads into a draft, and stops there — which is how you try a risky
  # pipeline change, like turning on Developer ID signing, without any install seeing it.
  # Inspect the draft's assets, then delete the draft. Plain tags publish as normal.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
