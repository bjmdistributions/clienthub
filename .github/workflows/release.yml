name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ONE job creates the draft, and the build legs only upload into it.
  #
  # tauri-action's own flow is "look for a draft with this tag, create one if it is
  # missing" — which two matrix legs run concurrently. On v0.16.73 they finished four
  # seconds apart, both looked, both missed, and both created a release for the same
  # tag: one draft held the Windows assets, the other the macOS ones. `publish` flipped
  # whichever one it found, so a green run with two green legs shipped a Windows-only
  # release whose latest.json had no darwin keys. Every previous release had simply been
  # lucky: the legs usually finish minutes apart.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
    steps:
      - id: draft
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Reuse the draft if this tag is being re-run, so a re-run never forks it either.
            const { data: existing } = await github.rest.repos.listReleases({
              owner: context.repo.owner, repo: context.repo.repo, per_page: 100,
            });
            const found = existing.find(r => r.tag_name === tag && r.draft);
            if (found) { core.info(`Reusing draft ${found.id} for ${tag}`); return String(found.id); }
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              tag_name: tag, name: `Ecliptr ${tag}`,
              body: 'Download the installer for your platform below. See https://ecliptr.app/download to get set up.',
              draft: true, prerelease: false,
            });
            core.info(`Created draft ${data.id} for ${tag}`);
            return String(data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    # tauri-action CREATES the draft release, which needs write access to
    # contents. Without this key the job inherits the repository's default
    # GITHUB_TOKEN permissions, and v0.16.72's Windows leg died on
    # "Resource not accessible by integration" at the create-release call after
    # a clean 14-minute build — while v0.16.71, 45 minutes earlier, had been
    # fine. Whatever moved the default, the release must not depend on it:
    # `publish` below already declares the same permission for the same reason.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (with universal target on macOS)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Developer ID signing + notarization. APPLE_SIGNING_IDENTITY is deliberately
          # absent: tauri-bundler derives the identity from the certificate itself, and
          # setting it by hand only adds a way to mismatch. The ad-hoc signing step that
          # used to sit above set it to "-", which hard-errors against a real certificate.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # releaseId, NOT tagName: with a tag the action looks for the draft and
          # creates one when it does not see it, which is the race above.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Built as a draft so a half-finished release can never reach the updater.
          # Both matrix legs upload into the same draft; the `publish` job below flips
          # it public only once BOTH have succeeded. See that job for why.
          releaseDraft: true
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brokr-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe

  # A release goes public only when every platform built.
  #
  # `fail-fast: false` above is deliberate — one platform failing should not cancel the
  # other, so we still get the artifacts and the logs. But combined with an immediately
  # public release it used to mean a failed leg still shipped: v0.14.6, v0.14.7 and
  # v0.14.8 each published with Windows assets only and a latest.json carrying no darwin
  # keys, and every Mac silently stopped receiving updates for three releases. v0.15.130
  # did the mirror image (macOS only) during the 2026-08-06 Actions outage.
  #
  # `needs: build` fails if ANY matrix leg failed, so this job is skipped and the release
  # stays a draft. Drafts are invisible to /releases/latest/download/latest.json, so
  # installed apps keep seeing the last good version instead of a broken partial one.
  #
  # A tag containing a hyphen (v0.15.133-rc1, v0.16.0-signing-test) never auto-publishes.
  # It builds, uploads into a draft, and stops there — which is how you try a risky
  # pipeline change, like turning on Developer ID signing, without any install seeing it.
  # Inspect the draft's assets, then delete the draft. Plain tags publish as normal.
  publish:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Two green build jobs are not proof of a complete release. On v0.16.73 both
      # legs passed and the release still went out Windows-only, because each leg had
      # uploaded into a DIFFERENT draft. Assert the thing that actually matters — what
      # the updater will read — before making it public.
      - name: The draft must carry every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="${{ needs.create-release.outputs.release_id }}"
          gh api "repos/${{ github.repository }}/releases/$id/assets" --jq '.[].name' > names.txt
          echo "Assets in the draft:"; cat names.txt
          for want in "universal.dmg" "universal.app.tar.gz" "x64-setup.exe" "x64_en-US.msi" "latest.json"; do
            grep -q -- "$want" names.txt || { echo "MISSING from the draft: $want"; exit 1; }
          done
          asset=$(gh api "repos/${{ github.repository }}/releases/$id/assets" --jq '.[] | select(.name == "latest.json") | .id')
          gh api -H "Accept: application/octet-stream" "repos/${{ github.repository }}/releases/assets/$asset" > latest.json
          echo "Platforms in latest.json:"; jq -r '.platforms | keys[]' latest.json
          jq -e '.version == "${{ github.ref_name }}"[1:]' latest.json > /dev/null             || { echo "latest.json version does not match the tag"; exit 1; }
          jq -e '[.platforms | keys[] | select(startswith("darwin"))] | length >= 3' latest.json > /dev/null             || { echo "latest.json has no darwin platforms — Macs would stop updating"; exit 1; }
          jq -e '[.platforms | keys[] | select(startswith("windows"))] | length >= 1' latest.json > /dev/null             || { echo "latest.json has no windows platforms"; exit 1; }
          jq -e '[.platforms[] | select((.signature // "") == "")] | length == 0' latest.json > /dev/null             || { echo "an unsigned platform entry — the updater would reject it"; exit 1; }

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false
