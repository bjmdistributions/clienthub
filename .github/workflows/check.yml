name: Check

# Check only. Nothing here builds an installer, signs anything, publishes a release
# or touches a server — release.yml owns all of that, and it triggers on tags alone.
# Do not add a deploy step to this file. The point of a check that runs on every push
# is that it is safe enough to run on every push.
#
# Until this existed, the first thing that ever compiled the tree was the release
# build itself, so a type error surfaced while a version was being cut.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches release.yml. package.json declares no engines field, so the
          # version that cuts releases is the only meaningful reference.
          node-version: 20
          cache: 'npm'

      - run: npm ci

      # The same command release.yml runs as half of `npm run build`, minus the
      # bundling — so a type error fails here instead of mid-release.
      - name: Typecheck
        run: npm run typecheck

      # Warnings do not fail this step, and that is deliberate: the config holds
      # every already-clean rule at error and everything with existing violations
      # at warn, so main exits 0 today. See eslint.config.js for the ratchet.
      - name: Lint
        run: npm run lint

      # R-134b. The TypeScript half of `cargo test` below — Vitest over the pure
      # helpers in src/lib. `vitest run`, never bare `vitest`, which watches and
      # would hang the job forever. Note that vitest exits 1 when it finds no test
      # files at all, so deleting the last test breaks the build rather than going
      # quiet. See vitest.config.ts for what the suite deliberately does not cover.
      - name: Test
        run: npm test

      # R-134e. Colours belong to the design tokens, not to the component that
      # happens to need one. A raw hex in a .tsx is invisible to a theme change
      # and to the accent system, and every one of them has to be found by hand.
      #
      # This is a ratchet in the same spirit as the eslint config above: the 18
      # files that already contain hex are allowlisted so main exits 0 today, and
      # the guard only fails on a file that is not on the list. Converting the
      # existing ones is a design decision for the owner, not something CI should
      # force. When a file is cleaned up, delete its line — that is what stops it
      # regressing. Do not add a line to keep a new violation; use a token.
      # The list and the check live in scripts/check-hex-colours.sh, which the
      # pre-push hook (.githooks/pre-push) runs too.
      - name: No new raw hex colours
        run: bash scripts/check-hex-colours.sh

  rust:
    # windows-latest, not ubuntu. This tree has only ever been compiled on Windows
    # and macOS (release.yml's matrix), and the desktop deps that reach the OS —
    # keyring, native-tls, imap — would be exercised on Linux here for the first
    # time. A check that fails for reasons unrelated to the commit teaches everyone
    # to ignore it.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # No `npm run build` first. dist/ is gitignored so a fresh checkout never has
      # it, but generate_context! embeds no assets while devUrl is set, so the path
      # is not read during check or test. Verified by deleting dist/ locally, forcing
      # a full recompile of the crate, and watching `cargo check --bin clienthub`
      # still finish clean. If this ever fails on frontendDist, add `npm ci && npm
      # run build` above rather than deleting this job.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --bin clienthub

      # --bin clienthub, never --lib. src/lib.rs is a one-line placeholder that
      # declares no modules, so `cargo test --lib` compiles nothing, runs 0 tests
      # and reports ok — a green that means nothing. All 45 tests hang off the
      # binary target.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --bin clienthub

  # A tag is not a release. Seven tags in this repo's history built nothing and nobody
  # noticed until someone went looking: v0.12.1, v0.12.3, v0.14.5, v0.15.84 (no run or a
  # failed one), v0.15.131 (the 2026-08-06 Actions outage), v0.16.72 (the release job
  # lost `contents: write` and died at create-release after a clean 14-minute build) and
  # v0.16.81 (see below). Each one left a version number that exists in git, is quoted in
  # commit messages and in the vault, and that no install can ever receive — gotchas §12,
  # "written is not shipped", and §52.
  #
  # Ratchet, same shape as the hex guard above: the six are allowlisted so main is green
  # today, and only a NEW dead tag fails. A tag whose build is still running is skipped,
  # so tagging and pushing in the usual order never trips this.
  #
  # Hyphenated tags (v0.16.74-rc1) are excluded by design, not by omission: release.yml
  # builds them into a draft and deliberately never publishes, which is how a risky
  # pipeline change is tried. Delete the draft when you are done with it.
  tags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A tag that produced no release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Known dead, left in history on purpose: this project never deletes a tag.
          # Do not add a line here to silence a new one — find out why it shipped nothing.
          # v0.16.81 (2026-09-16, R-318): its commit registered `analytics_reconciliation`
          # in main.rs's invoke_handler while the command itself was still uncommitted in
          # another session's working copy, so `cargo check` failed on both build targets
          # and the release job never ran. It is dead ON PURPOSE and must never be
          # re-run: v0.16.82 published 19 minutes later and carries the same R-318 code,
          # so publishing .81 now would make it the newest release and point latest.json
          # — and every installed updater — at the OLDER build.
          # v0.16.132 and v0.16.133 (2026-10-05, R-443/R-444): GitHub's macOS runner never ran
          # .132 (create-release cancelled) and "lost communication with the server" 50 minutes
          # into .133's build; both code changes are inside v0.16.134 (R-449), which superseded
          # them. Dead ON PURPOSE for the same reason as v0.16.81: never re-run either.
          # v0.16.179 (2026-10-15, R-538): the Windows leg failed at `npm ci` after 4 minutes while the
          # same lockfile installed on Linux (Check) and macOS for that commit, and on Windows for
          # v0.16.178 an hour earlier, so the runner, not the code. v0.16.180 carries the same commit's
          # code and superseded it. Dead ON PURPOSE for the same reason as v0.16.81: never re-run.
          allow="v0.12.1 v0.12.3 v0.14.5 v0.15.84 v0.15.131 v0.16.72 v0.16.81 v0.16.132 v0.16.133 v0.16.179"
          gh api --paginate "repos/$R/releases" --jq '.[] | select(.draft == false) | .tag_name' > published.txt
          echo "Published releases: $(wc -l < published.txt)"
          dead=""
          for tag in $(git tag -l 'v*' | grep -v -- '-'); do
            case " $allow " in *" $tag "*) continue ;; esac
            if grep -qxF -- "$tag" published.txt; then continue; fi
            # Still building, or queued? Not dead yet.
            state=$(gh api "repos/$R/actions/runs?head_branch=$tag&per_page=1" --jq '.workflow_runs[0].status // "none"')
            if [ "$state" != "completed" ] && [ "$state" != "none" ]; then
              echo "  ... $tag is mid-build ($state), skipping"
              continue
            fi
            if [ "$state" = "none" ]; then
              # No run at all. Give a freshly pushed tag time for Actions to pick it up.
              age=$(( ( $(date +%s) - $(git log -1 --format=%ct "$tag") ) / 3600 ))
              if [ "$age" -lt 6 ]; then
                echo "  ... $tag has no run yet and is ${age}h old, skipping"
                continue
              fi
            fi
            dead="$dead $tag"
          done
          if [ -n "$dead" ]; then
            echo "Tags with no published release:$dead"
            echo "Each is a version that exists in git and can never reach an install."
            echo "Re-run its Build & Release, or cut the next version — do not delete the tag."
            exit 1
          fi
          echo "Every plain tag has a published release."
