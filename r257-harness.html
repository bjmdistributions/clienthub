<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R-257 harness</title>
    <!--
      DEV ONLY. Not referenced by index.html, so npm run build never sees it.
      Renders TiersView against ten rows shaped like the live tiers table, to check
      that the Revenue and Frequency odometer digits sit on the same baseline and
      spacing as plain text (R-257).
    -->
    <script>
      window.__TAURI_INTERNALS__ = {
        invoke: (cmd, args) => Promise.resolve(window.__FIXTURE ? window.__FIXTURE(cmd, args) : null),
        transformCallback: (cb) => { window.__cb = cb; return 1; },
        unregisterListener: () => {},
        convertFileSrc: (p) => p,
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { windowLabel: "main", label: "main" },
        },
        plugins: {},
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/__r257-harness.tsx"></script>
  </body>
</html>
