<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R-554 harness</title>
    <!--
      DEV ONLY. Not referenced by index.html, so `npm run build` never sees it. Renders the real Warehouse
      screen with the Tauri bridge forwarded to the local test server (src/__r554-harness.tsx).
    -->
    <script>
      window.__TAURI_INTERNALS__ = {
        invoke: (cmd, args) => {
          try { return Promise.resolve(window.__FIXTURE ? window.__FIXTURE(cmd, args) : null); }
          catch (e) { return Promise.reject(String(e)); }
        },
        transformCallback: (cb) => { window.__cb = cb; return 1; },
        unregisterListener: () => {},
        convertFileSrc: (p) => p,
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { windowLabel: "main", label: "main" },
        },
        plugins: {},
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/__r554-harness.tsx"></script>
  </body>
</html>
