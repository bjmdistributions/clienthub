<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R-263 harness</title>
    <!--
      DEV ONLY. Not referenced by index.html, so npm run build never sees it.
      Mounts LeadBubbles (+ its three sub-view modals) and ApprovalsView against
      a window.__FIXTURE that answers every R-263 command with realistic data,
      for visual verification before the real server commands exist (Pass 2).
    -->
    <script>
      window.__TAURI_INTERNALS__ = {
        invoke: (cmd, args) => Promise.resolve(window.__FIXTURE ? window.__FIXTURE(cmd, args) : null),
        transformCallback: (cb) => { window.__cb = cb; return 1; },
        unregisterListener: () => {},
        convertFileSrc: (p) => p,
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { windowLabel: "main", label: "main" },
        },
        plugins: {},
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/__r263-harness.tsx"></script>
  </body>
</html>
