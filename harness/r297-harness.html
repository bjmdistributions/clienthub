<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R-297 harness</title>
    <!--
      DEV ONLY. Not referenced by index.html, so `npm run build` never sees it — same
      trick as shell-harness.html / lot-harness.html / r235-harness.html / r246-harness.html.

      Renders the REAL EmailView (defaults to the Newsletter tab) against the real
      163-client anonymised fixture in src/__r297-fixture/, for eyeballing R-297
      audience counts against expected.json's independent oracle.

      ?pick=1  simulates arriving from Clients "Email" bulk action with the first 5
               fixture clients preselected via the real sessionStorage hand-off.
      ?cats=1  simulates arriving from Inventory "Send to newsletter" with a category
               preselected via the real sessionStorage hand-off, same as r246's ?prefill=1.
    -->
    <script>
      window.__TAURI_INTERNALS__ = {
        invoke: (cmd, args) => Promise.resolve(window.__FIXTURE ? window.__FIXTURE(cmd, args) : null),
        transformCallback: (cb) => { window.__cb = cb; return 1; },
        unregisterListener: () => {},
        convertFileSrc: (p) => p,
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { windowLabel: "main", label: "main" },
        },
        plugins: {},
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/__r297-harness.tsx"></script>
  </body>
</html>
