[package]
name = "clienthub"
# Keep in step with src-tauri/tauri.conf.json — that file is what the release
# pipeline reads, and these two drifted 118 patch versions apart before 2026-08-07.
version = "0.16.38"
edition = "2021"

[lib]
name = "clienthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri core
# `unstable` enables multiple webviews in one window — used to embed WhatsApp Web
# directly inside the share panel (web.whatsapp.com refuses to be iframed).
tauri = { version = "2.0", features = ["protocol-asset", "unstable"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-drag = "2"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
tauri-plugin-clipboard-manager = "2.0"

# Async + serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Time + IDs
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
bcrypt = "0.15"

# HTTP + AI
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "multipart"] }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
imap = "2.4"
native-tls = "0.2"
mail-parser = "0.9"

# OAuth2 for Gmail/Outlook
oauth2 = "4.4"
tiny_http = "0.12"

# Credentials
keyring = "2"

# PDF
printpdf = { version = "0.7", features = ["embedded_images"] }

# Encryption for sync events
ring = "0.17"
base64 = "0.22"

# Errors
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File watching for sync
notify = "6.1"

# CSV import (Google Sheets export)
csv = "1.3"
rust_xlsxwriter = "0.77"

# Excel READING — supplier manifests arrive as .xlsx/.xls far more often than CSV
# (rust_xlsxwriter above only writes). Used by manifest.rs.
calamine = "0.26"

# Bank statement PDF text extraction (Chase statements) + PDF manifests
pdf-extract = "0.7"

# Regex for signup detection rules
regex = "1"

image = "0.24"
dirs = "5"
rand = "0.8"

# macOS 26 (Tahoe) launch-crash fix. macOS 26 changed the Obj-C type encoding for
# fast enumeration (countByEnumeratingWithState:objects:count:) from 'q' to 'Q';
# objc2's strict check then panics inside tao's did_finish_launching → SIGABRT on
# launch. This feature (already present in the locked objc2 0.6.4, just off) makes
# the signed/unsigned codes interchangeable. Cargo feature unification flips it for
# tao/wry too — no version bump. See tauri-apps/tao#1171.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", features = ["relax-sign-encoding"] }
