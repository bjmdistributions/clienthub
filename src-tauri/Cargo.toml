[package]
name = "clienthub"
version = "0.12.7"
edition = "2021"

[lib]
name = "clienthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# Tauri core
tauri = { version = "2.0", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"
tauri-plugin-notification = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"

# Async + serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono", "serde_json"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Time + IDs
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP + AI
reqwest = { version = "0.12", features = ["json", "stream", "blocking"] }

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls", "builder"] }
imap = "2.4"
native-tls = "0.2"
mail-parser = "0.9"

# OAuth2 for Gmail/Outlook
oauth2 = "4.4"
tiny_http = "0.12"

# Credentials
keyring = "2"

# PDF
printpdf = { version = "0.7", features = ["embedded_images"] }

# Encryption for sync events
ring = "0.17"
base64 = "0.22"

# Errors
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# File watching for sync
notify = "6.1"

# CSV import (Google Sheets export)
csv = "1.3"
rust_xlsxwriter = "0.77"

# Regex for signup detection rules
regex = "1"

image = "0.24"
dirs = "5"
rand = "0.8"
