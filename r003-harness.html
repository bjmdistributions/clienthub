<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>R-003 harness</title>
    <!--
      DEV ONLY. Not referenced by index.html, so `npm run build` never sees it —
      same trick as shell-harness.html / lot-harness.html / r235-harness.html.

      Verifies the R-003-ui bank-connection status pill on Settings > Team.
      ?banks=0 (default) | banks=1 | banks=2
    -->
    <script>
      window.__TAURI_INTERNALS__ = {
        invoke: (cmd, args) => Promise.resolve(window.__FIXTURE ? window.__FIXTURE(cmd, args) : null),
        transformCallback: (cb) => { window.__cb = cb; return 1; },
        unregisterListener: () => {},
        convertFileSrc: (p) => p,
        metadata: {
          currentWindow: { label: "main" },
          currentWebview: { windowLabel: "main", label: "main" },
        },
        plugins: {},
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/__r003-harness.tsx"></script>
  </body>
</html>
